name: Build Windows and Linux release

# Builds YouNet Portal Desktop for Windows and Linux from the private source repo at a
# desktop-v* tag and creates a DRAFT release here. A maintainer reviews it, adds the signed
# and notarized macOS files (built locally, see the source repo's app-desktop/docs/RELEASING.md)
# and publishes it.
#
# Why here: Actions minutes on this public repo are free on standard runners. The source stays
# private: it is checked out with SOURCE_DEPLOY_KEY, a read-only deploy key on
# nhocconan/bitrix-replaced-apps. Logs are public; no step prints source or secrets.
# Runs only on manual dispatch (maintainers); pull requests from forks never see the secret.
#
# Mirrors .github/workflows/desktop-release.yml in the source repo (build-windows, build-linux,
# assemble, publish). Keep the two in step.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Source tag, for example desktop-v1.1.2 (must match app-desktop/package.json)'
        required: true

permissions:
  contents: read

concurrency:
  group: build-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  SOURCE_REPO: nhocconan/bitrix-replaced-apps
  FUSES_EXPECTED_JS: >-
    const f = require('./package.json').build.electronFuses || {};
    const l = Object.entries(f).filter(([k]) => k !== 'resetAdHocDarwinSignature')
      .map(([k, v]) => k[0].toUpperCase() + k.slice(1) + ' is ' + (v ? 'Enabled' : 'Disabled'));
    if (!l.length) { console.error('build.electronFuses is empty'); process.exit(1); }
    console.log(l.join(';'));
  FUSES_CLI: '@electron/fuses@2.1.3'
  CYCLONEDX_CLI: '@cyclonedx/cyclonedx-npm@6.0.1'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - name: Check the tag name
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must look like desktop-v1.2.3"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: refs/tags/${{ inputs.tag }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: app-desktop/package.json
          sparse-checkout-cone-mode: false
      - id: v
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./app-desktop/package.json').version")"
          [[ "desktop-v${version}" == "$TAG" ]] || { echo "::error::$TAG does not match package.json version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            name: windows
            build: build:win
            files: 'dist/*.exe dist/*.exe.blockmap dist/latest*.yml'
          - os: ubuntu-latest
            name: linux
            build: build:linux
            files: 'dist/*.AppImage dist/*.deb dist/latest*.yml'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: app-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.preflight.outputs.sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: app-desktop
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app-desktop/package-lock.json
      - run: npm ci
      - name: Session and renderer regression checks
        run: npm test
      - name: Build (unsigned on Windows)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.build }} -- --publish never
      - name: Verify Electron fuses
        run: |
          set -euo pipefail
          if [[ "${{ matrix.name }}" == windows ]]; then
            exe="$(find dist/win-unpacked -maxdepth 1 -name '*.exe' | head -1)"
          else
            exe="dist/linux-unpacked/$(node -p "require('./package.json').name.toLowerCase()")"
          fi
          [[ -n "$exe" && -f "$exe" ]] || { echo "::error::No executable found"; exit 1; }
          out="$(npx --yes "$FUSES_CLI" read --app "$exe")"
          echo "$out"
          IFS=';' read -ra want <<< "$(node -e "$FUSES_EXPECTED_JS")"
          (( ${#want[@]} > 0 )) || { echo "::error::Could not read build.electronFuses"; exit 1; }
          for f in "${want[@]}"; do
            grep -qF "$f" <<< "$out" || { echo "::error::Fuse check failed: expected '$f'"; exit 1; }
          done
      - name: Stage release files (spaces -> '-')
        run: |
          set -euo pipefail
          mkdir -p release
          shopt -s nullglob
          for f in ${{ matrix.files }}; do
            name="$(basename "$f")"
            cp "$f" "release/${name// /-}"
          done
          ls -l release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: app-desktop/release/*
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.preflight.outputs.sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: |
            app-desktop/package.json
            app-desktop/package-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: bundle
          merge-multiple: true
      - name: Check update metadata against the files
        working-directory: bundle
        run: |
          set -euo pipefail
          for req in latest.yml latest-linux.yml; do
            [[ -f "$req" ]] || { echo "::error::$req missing"; exit 1; }
          done
          for y in latest*.yml; do
            checked=0
            while read -r url sha; do
              [[ -n "$url" ]] || continue
              [[ -f "$url" ]] || { echo "::error::$y lists $url, which is not in the release files."; exit 1; }
              actual="$(openssl dgst -sha512 -binary "$url" | base64 -w0)"
              [[ "$actual" == "$sha" ]] || { echo "::error::$y sha512 for $url does not match the file."; exit 1; }
              echo "ok  $y -> $url"
              checked=$((checked + 1))
            done <<< "$(yq -r '.files[] | .url + " " + .sha512' "$y")"
            (( checked > 0 )) || { echo "::error::$y lists no files."; exit 1; }
          done
      - name: CycloneDX SBOMs
        working-directory: app-desktop
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          npx --yes "$CYCLONEDX_CLI" --package-lock-only --omit dev --spec-version 1.6 \
            --output-format JSON --output-file "../bundle/younet-intranet-desktop-${VERSION}.sbom.cdx.json"
          npx --yes "$CYCLONEDX_CLI" --package-lock-only --spec-version 1.6 \
            --output-format JSON --output-file "../bundle/younet-intranet-desktop-${VERSION}.build-sbom.cdx.json"
      - name: SHA256SUMS.txt
        working-directory: bundle
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: bundle/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [preflight, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read  # download the release-bundle artifact
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: bundle
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          mapfile -t files < <(find bundle -maxdepth 1 -type f | LC_ALL=C sort)
          existing="$(gh api "repos/${REPO}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"${tag}\")][0] | if . == null then \"\" else (.draft|tostring) end")"
          if [[ "$existing" == "false" ]]; then
            echo "::error::Release ${tag} is already published; bump the version instead of overwriting it."
            exit 1
          elif [[ "$existing" == "true" ]]; then
            gh release upload "$tag" -R "$REPO" --clobber "${files[@]}"
          else
            notes="YouNet Portal Desktop ${VERSION} (source ${SOURCE_SHA:0:7}). Windows installers are not code-signed yet: SmartScreen shows \"More info\" > \"Run anyway\". Verify downloads with SHA256SUMS.txt."
            gh release create "$tag" -R "$REPO" --draft --target main \
              --title "YouNet Portal Desktop ${VERSION}" --notes "$notes" "${files[@]}"
          fi
          echo "Draft ready: https://github.com/${REPO}/releases (add macOS files, then publish)"
